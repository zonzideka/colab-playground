[package]
name = "colab-playground-core"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["http"]
# Blocking HTTPS client used for Hugging Face lookups. Disabled builds keep the
# whole API and report `ErrorKind::HttpUnavailable` instead.
http = ["dep:ureq"]

[dependencies]
base64 = "0.22"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
